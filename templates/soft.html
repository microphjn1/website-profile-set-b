<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/interest.css">
    <title>Software/Web Developer</title>
</head>

<body>
    <a class="back" href="{{ url_for('app_bp.career_page') }}">&larr; Back</a>
    <section class="parents">
        <p style="font-family: monospace; font-size: 35px; text-align: center;">Software/Web-developer</p>
        <div class="student-container">
            {% for s in student %}
            <div class="student-card">
                {% set pic = s['picture'] if '/' in s['picture'] else 'uploads/' ~ s['picture'] %}
                <img src="{{ url_for('static', filename=pic) }}" alt="{{ s['name'] }}'s picture">
                <div class="student-info">
                    <h2>{{ s['name'] }}</h2>
                    <p>{{ s['course'] }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>
</body>

</html>
